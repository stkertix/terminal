<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Terminal</title>
    <link rel="stylesheet" href="terminal.css" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="tabbar">
          <div id="tabs" role="tablist" aria-label="Tabs"></div>
          <button type="button" id="new-tab" title="New tab" aria-label="New tab">+</button>
        </div>
        <div class="layouts" role="toolbar" aria-label="Layout">
          <button type="button" class="layout-btn is-active" data-layout="single" title="Single" aria-label="Single" aria-pressed="true">
            <svg viewBox="0 0 16 12" aria-hidden="true"><rect x="1" y="1" width="14" height="10" rx="1"></rect></svg>
          </button>
          <button type="button" class="layout-btn" data-layout="columns" title="Columns" aria-label="Columns" aria-pressed="false">
            <svg viewBox="0 0 16 12" aria-hidden="true"><rect x="1" y="1" width="6" height="10" rx="1"></rect><rect x="9" y="1" width="6" height="10" rx="1"></rect></svg>
          </button>
          <button type="button" class="layout-btn" data-layout="rows" title="Rows" aria-label="Rows" aria-pressed="false">
            <svg viewBox="0 0 16 12" aria-hidden="true"><rect x="1" y="1" width="14" height="4" rx="1"></rect><rect x="1" y="7" width="14" height="4" rx="1"></rect></svg>
          </button>
          <button type="button" class="layout-btn" data-layout="grid" title="Grid" aria-label="Grid" aria-pressed="false">
            <svg viewBox="0 0 16 12" aria-hidden="true"><rect x="1" y="1" width="6" height="4" rx="1"></rect><rect x="9" y="1" width="6" height="4" rx="1"></rect><rect x="1" y="7" width="6" height="4" rx="1"></rect><rect x="9" y="7" width="6" height="4" rx="1"></rect></svg>
          </button>
        </div>
      </header>
      <div id="workspaces"></div>
    </div>
    <script type="module" src="terminal.js"></script>
  </body>
</html>
